name: Profile assets

# Regenerates the data-driven README artwork (stats card + contribution snake)
# and publishes it to the orphan `output` branch, which the README links to.
# The static artwork in /assets is built locally with scripts/build-assets.mjs.

on:
  schedule:
    - cron: "17 5 * * *" # every day, 02:17 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stats card
        run: node scripts/build-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#5ef2c2&color_dots=#161b22,#143d36,#1f7a63,#3cc79d,#5ef2c2
            dist/snake-light.svg?palette=github-light&color_snake=#5b4bdb&color_dots=#ebedf0,#c4f1e3,#7fdcc0,#2fb892,#0a8f6d

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "chore: refresh profile assets"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
